name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'vault/packages/**/olore-lock.json'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g., "prisma@latest")'
        required: true
        type: string

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect packages to publish
        id: detect
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ -n "$INPUT_PACKAGE" ]; then
            PKG_NAME="${INPUT_PACKAGE%@*}"
            PKG_VERSION="${INPUT_PACKAGE#*@}"
            echo "${PKG_NAME}/${PKG_VERSION}" > /tmp/packages.txt
            echo "Manual trigger: ${PKG_NAME}@${PKG_VERSION}"
          else
            git diff --name-only HEAD~1 HEAD -- 'vault/packages/**/olore-lock.json' \
              | sed 's|vault/packages/||; s|/olore-lock.json||' \
              > /tmp/packages.txt || true
          fi

          if [ ! -s /tmp/packages.txt ]; then
            echo "No packages to publish"
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "Packages to publish:"
            cat /tmp/packages.txt
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish each package
        if: steps.detect.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r PKG; do
            NAME="${PKG%/*}"
            VERSION="${PKG#*/}"
            TAG="${NAME}@${VERSION}"
            PKG_DIR="vault/packages/${NAME}/${VERSION}"
            TARBALL="${NAME}-${VERSION}.tar.gz"

            echo "::group::${TAG}"

            # Verify package exists
            if [ ! -f "${PKG_DIR}/olore-lock.json" ]; then
              echo "::warning::Skipping ${TAG} - olore-lock.json not found"
              echo "::endgroup::"
              continue
            fi

            # Delete existing release if present
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

            # Create tarball with top-level directory (CLI extracts with strip: 1)
            STAGING=$(mktemp -d)
            mkdir -p "${STAGING}/${NAME}-${VERSION}"
            cp -r "${PKG_DIR}/"* "${STAGING}/${NAME}-${VERSION}/"
            tar -czf "${TARBALL}" -C "${STAGING}" "${NAME}-${VERSION}"
            rm -rf "${STAGING}"

            # Calculate SHA256 in base64 (SRI format, matching CLI's sha256-<base64>)
            openssl dgst -sha256 -binary "${TARBALL}" | base64 -w0 > "${TARBALL}.sha256"

            # Create release
            FILES=$(jq -r '.files' "${PKG_DIR}/olore-lock.json")
            BUILT_AT=$(jq -r '.builtAt' "${PKG_DIR}/olore-lock.json")

            gh release create "$TAG" \
              --title "${TAG}" \
              --notes "Files: ${FILES} | Built: ${BUILT_AT} | SHA256: $(cat "${TARBALL}.sha256")" \
              "${TARBALL}" \
              "${TARBALL}.sha256"

            echo "Published ${TAG} ($(du -h "${TARBALL}" | cut -f1))"
            rm -f "${TARBALL}" "${TARBALL}.sha256"
            echo "::endgroup::"
          done < /tmp/packages.txt

      - name: Update registry.json
        if: steps.detect.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Building combined registry.json from all releases..."

          # Fetch all package releases (name@version pattern) via paginated API
          gh api --paginate repos/olorehq/olore/releases \
            --jq '.[] | select(.tag_name | test("@")) | {tag: .tag_name, published_at: .published_at, assets: [.assets[] | {name, size, browser_download_url}]}' \
            > /tmp/releases.jsonl

          # Start building registry JSON
          REGISTRY=$(jq -n '{version: 2, updated: (now | todate), packages: {}}')

          # Process each config to get descriptions
          declare -A DESCRIPTIONS
          for CONFIG in vault/configs/*.json; do
            PKG_NAME=$(jq -r '.name' "$CONFIG")
            PKG_DESC=$(jq -r '.description // ""' "$CONFIG")
            DESCRIPTIONS[$PKG_NAME]="$PKG_DESC"
          done

          # Group releases by package name and build entries
          declare -A PKG_VERSIONS
          declare -A PKG_LATEST

          while IFS= read -r RELEASE; do
            TAG=$(echo "$RELEASE" | jq -r '.tag')
            NAME="${TAG%@*}"
            VERSION="${TAG#*@}"
            PUBLISHED=$(echo "$RELEASE" | jq -r '.published_at')

            TARBALL_NAME="${NAME}-${VERSION}.tar.gz"
            SHA256_NAME="${TARBALL_NAME}.sha256"

            # Get tarball info
            TARBALL_URL=$(echo "$RELEASE" | jq -r --arg n "$TARBALL_NAME" '.assets[] | select(.name == $n) | .browser_download_url')
            TARBALL_SIZE=$(echo "$RELEASE" | jq -r --arg n "$TARBALL_NAME" '.assets[] | select(.name == $n) | .size')

            if [ -z "$TARBALL_URL" ] || [ "$TARBALL_URL" = "null" ]; then
              echo "  Skipping ${TAG} - no tarball asset"
              continue
            fi

            # Get SHA256 hash
            SHA256_URL=$(echo "$RELEASE" | jq -r --arg n "$SHA256_NAME" '.assets[] | select(.name == $n) | .browser_download_url')
            INTEGRITY=""
            if [ -n "$SHA256_URL" ] && [ "$SHA256_URL" != "null" ]; then
              HASH=$(curl -sL "$SHA256_URL" | head -c 100 | tr -d '[:space:]')
              if [ -n "$HASH" ]; then
                INTEGRITY="sha256-${HASH}"
              fi
            fi

            # Get file count from lock file if available
            FILES=0
            LOCK_FILE="vault/packages/${NAME}/${VERSION}/olore-lock.json"
            if [ -f "$LOCK_FILE" ]; then
              FILES=$(jq -r '.files // 0' "$LOCK_FILE")
            fi

            # Build version entry JSON
            VERSION_JSON=$(jq -n \
              --arg v "$VERSION" \
              --argjson f "$FILES" \
              --argjson s "${TARBALL_SIZE:-0}" \
              --arg i "$INTEGRITY" \
              --arg d "$TARBALL_URL" \
              --arg r "$PUBLISHED" \
              '{version: $v, files: $f, size: $s, integrity: $i, downloadUrl: $d, releasedAt: $r}')

            # Accumulate versions per package
            if [ -z "${PKG_VERSIONS[$NAME]+x}" ]; then
              PKG_VERSIONS[$NAME]="{}"
            fi
            PKG_VERSIONS[$NAME]=$(echo "${PKG_VERSIONS[$NAME]}" | jq --arg v "$VERSION" --argjson vj "$VERSION_JSON" '. + {($v): $vj}')
            PKG_LATEST[$NAME]="$VERSION"

            echo "  Added ${TAG}"
          done < /tmp/releases.jsonl

          # Assemble final registry
          for NAME in "${!PKG_VERSIONS[@]}"; do
            DESC="${DESCRIPTIONS[$NAME]:-}"
            LATEST="${PKG_LATEST[$NAME]}"
            VERSIONS_OBJ="${PKG_VERSIONS[$NAME]}"

            REGISTRY=$(echo "$REGISTRY" | jq \
              --arg name "$NAME" \
              --arg desc "$DESC" \
              --arg latest "$LATEST" \
              --argjson versions "$VERSIONS_OBJ" \
              '.packages[$name] = {description: $desc, latest: $latest, versions: $versions}')
          done

          # Sort packages alphabetically
          REGISTRY=$(echo "$REGISTRY" | jq '.packages = (.packages | to_entries | sort_by(.key) | from_entries)')

          echo "$REGISTRY" > /tmp/registry.json
          PKG_COUNT=$(echo "$REGISTRY" | jq '.packages | length')
          echo "Built registry.json with ${PKG_COUNT} packages ($(du -h /tmp/registry.json | cut -f1))"

          # Upload as a GitHub Release asset under the "registry" tag
          gh release delete registry --yes --cleanup-tag 2>/dev/null || true
          gh release create registry \
            --title "Package Registry" \
            --notes "Auto-generated combined registry. Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            /tmp/registry.json

          echo "Published registry.json as GitHub Release asset"

      - name: Trigger Vercel redeploy
        if: steps.detect.outputs.has_packages == 'true'
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -sf -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Triggered Vercel redeploy to update registry (fallback)"
          else
            echo "No VERCEL_DEPLOY_HOOK configured - Vercel registry is secondary fallback"
          fi
